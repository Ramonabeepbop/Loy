<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Loy — Water Quiz</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="game">


    <!-- HEADER -->

    <header class="top-bar">

      <div class="logo">
        loy
      </div>

      <div class="level">

        LVL
        <span id="level">
          1
        </span>

      </div>

    </header>


    <!-- SPRITE CARD -->

    <section class="pet-card">

      <div
        class="speech"
        id="speech"
      >
        Let's learn about water.
      </div>


      <div class="pet-stage">

        <div class="shadow"></div>


        <div
          class="pet"
          id="pet"
        >

          <!--
            Replace "sprite.png"
            with your own image.
          -->

          <img
            src="sprite.png"
            alt="Water character"
            class="pet-sprite"
          >

        </div>

      </div>


      <!-- XP -->

      <div class="xp-section">

        <div class="xp-info">

          <span>
            WATER KNOWLEDGE
          </span>

          <span id="xpText">
            0 / 100
          </span>

        </div>


        <div class="xp-bar">

          <div id="xpFill"></div>

        </div>

      </div>

    </section>


    <!-- QUIZ -->

    <section class="quiz-card">

      <div
        class="question-number"
        id="questionNumber"
      >
        QUESTION 1
      </div>


      <h1 id="question">
        Loading question...
      </h1>


      <div
        class="answers"
        id="answers"
      >
      </div>


      <div
        class="feedback"
        id="feedback"
      >
      </div>


      <button
        class="next-button"
        id="nextButton"
      >
        NEXT QUESTION
      </button>

    </section>


    <!-- WATER FACT -->

    <section class="fact-card">

      <div class="fact-label">
        WATER FACT
      </div>

      <div>

        <strong id="factTitle">
          KEEP LEARNING
        </strong>

        <p id="fact">
          Small changes in everyday water use can make a difference.
        </p>

      </div>

    </section>


    <!-- RESET -->

    <button
      class="reset"
      id="resetButton"
    >
      reset progress
    </button>


  </main>


  <script src="script.js"></script>

</body>

</html>
